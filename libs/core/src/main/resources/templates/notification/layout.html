<!--/* The frame of every notification email. `title` is the subject, `body` the rendered template. */-->
<html xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:24px 0;background:#f4f5f7;">
  <table role="presentation" cellspacing="0" cellpadding="0" align="center"
         style="width:100%;max-width:600px;margin:0 auto;background:#ffffff;border-radius:8px;font-family:Helvetica Neue,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.5;color:#1a1a1a;">
    <tr>
      <td style="padding:28px 32px 0;font-size:20px;font-weight:700;" th:text="${title}">Тема</td>
    </tr>
    <tr>
      <td style="padding:16px 32px;" th:utext="${body}">Текст</td>
    </tr>
    <tr>
      <td style="padding:16px 32px;border-top:1px solid #eceef1;font-size:14px;color:#6b7280;">Команда VKurse</td>
    </tr>
  </table>
</body>
</html>
